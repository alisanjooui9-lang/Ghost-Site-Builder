<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پیگیری سفارش | Ghost Site Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:white;
    font-family:tahoma,Arial,sans-serif;
}

.header{
    height:70px;
    background:#101010;
    border-bottom:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    background:#222;
    border:1px solid #444;
    padding:9px 13px;
    border-radius:10px;
}

.container{
    max-width:600px;
    margin:auto;
    padding:35px 15px;
}

.title{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    color:#888;
    text-align:center;
    font-size:13px;
    line-height:1.9;
    margin-bottom:25px;
}

.box{
    background:#121212;
    border:1px solid #303030;
    border-radius:20px;
    padding:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:13px;
}

input{
    width:100%;

    background:#222;
    color:white;

    border:1px solid #444;
    border-radius:11px;

    padding:14px;

    outline:none;

    font-family:tahoma;
}

button{
    width:100%;

    margin-top:15px;

    padding:14px;

    border:0;
    border-radius:12px;

    background:white;
    color:black;

    font-family:tahoma;
    font-weight:bold;

    cursor:pointer;
}

.result{
    display:none;
    margin-top:20px;

    background:#181818;
    border:1px solid #333;

    border-radius:15px;
    padding:18px;

    line-height:2;
}

.status{
    margin-top:12px;

    padding:12px;

    border-radius:10px;

    background:#252525;

    text-align:center;
    font-weight:bold;
}

.error{
    display:none;

    margin-top:15px;

    background:#351818;
    border:1px solid #5a2525;

    color:#ffaaaa;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:12px;
}

.footer{
    text-align:center;
    color:#555;
    padding:30px 15px;
    font-size:12px;
}

</style>

</head>


<body>


<header class="header">

<div class="logo">
👻 Ghost Site Builder
</div>

<a
class="back"
href="index.html">

← خانه

</a>

</header>


<main class="container">


<h1 class="title">
🔎 پیگیری سفارش
</h1>


<p class="subtitle">

کد رهگیری درخواستت را وارد کن
تا آخرین وضعیت سفارش را ببینی.

</p>


<div class="box">


<label for="trackingCode">
کد رهگیری
</label>


<input
id="trackingCode"
type="text"
placeholder="مثلاً GHOST-1723456789">


<button
onclick="trackOrder()">

🔎 پیگیری سفارش

</button>


<div
class="error"
id="error">

❌ سفارشی با این کد پیدا نشد.

</div>


<div
class="result"
id="result">

<div>
📦 پروژه:
<span id="project"></span>
</div>

<div>
👤 نام:
<span id="name"></span>
</div>

<div>
📂 نوع سایت:
<span id="type"></span>
</div>

<div>
🕒 تاریخ ثبت:
<span id="date"></span>
</div>

<div class="status">

وضعیت:
<br>

<span id="status"></span>

</div>

</div>


</div>


</main>


<footer class="footer">

👻 Ghost Site Builder

<br><br>

ساخته شده توسط GHOST ACADEMY

<br><br>

© 2026

</footer>


<script>

function trackOrder(){

const code =
document
.getElementById("trackingCode")
.value
.trim();


const error =
document.getElementById("error");

const result =
document.getElementById("result");


error.style.display="none";
result.style.display="none";


if(!code){

error.innerText =
"❌ لطفاً کد رهگیری را وارد کن.";

error.style.display="block";

return;

}


const requests =
JSON.parse(
localStorage.getItem("ghost_requests") || "[]"
);


const request =
requests.find(function(item){

return item.id.toLowerCase() ===
code.toLowerCase();

});


if(!request){

error.innerText =
"❌ سفارشی با این کد پیدا نشد.";

error.style.display="block";

return;

}


document
.getElementById("project")
.innerText =
request.project;


document
.getElementById("name")
.innerText =
request.name;


document
.getElementById("type")
.innerText =
request.type;


document
.getElementById("date")
.innerText =
request.date;


document
.getElementById("status")
.innerText =
request.status;


result.style.display="block";

}

</script>


</body>

</html>
