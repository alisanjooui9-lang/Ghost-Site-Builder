<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ثبت طراحی | Ghost Site Builder</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070707;
    color:white;
    font-family:tahoma,Arial,sans-serif;
}

.header{
    height:70px;
    background:#101010;
    border-bottom:1px solid #292929;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    background:#222;
    border:1px solid #444;
    padding:9px 13px;
    border-radius:10px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:30px 15px 50px;
}

.title{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#888;
    font-size:13px;
    line-height:1.9;
}

.box{
    background:#121212;
    border:1px solid #303030;
    border-radius:20px;
    padding:20px;
    margin-top:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-size:13px;
}

input,
textarea{
    width:100%;
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:11px;
    padding:13px;
    font-family:tahoma;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.design-preview{
    margin-top:20px;
    padding:18px;
    border-radius:15px;
    background:#191919;
    border:1px solid #333;
}

.color-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    color:#aaa;
    font-size:12px;
}

.color{
    width:35px;
    height:25px;
    border-radius:7px;
    border:1px solid #555;
}

button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:white;
    color:black;
    font-family:tahoma;
    font-weight:bold;
    cursor:pointer;
}

.success{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:12px;
    background:#17251b;
    border:1px solid #31563a;
    color:#b9f5c5;
    line-height:2;
}

</style>

</head>

<body>

<header class="header">

<div class="logo">
👻 Ghost Site Builder
</div>

<a
class="back"
href="designer.html">
← طراحی
</a>

</header>


<main class="container">

<h1 class="title">
🚀 ثبت طراحی سایت
</h1>

<p class="subtitle">
اطلاعات خودت را وارد کن تا طراحی ساخته‌شده برای بررسی ارسال شود.
</p>


<div class="box">

<label>
نام شما
</label>

<input
id="name"
type="text"
placeholder="نام شما"
required>


<label>
راه ارتباطی
</label>

<input
id="contact"
type="text"
placeholder="ایمیل یا آیدی شبکه اجتماعی"
required>


<label>
توضیحات اضافی
</label>

<textarea
id="description"
placeholder="اگر توضیح دیگری درباره سایت داری اینجا بنویس...">
</textarea>


<div class="design-preview">

<strong>
🎨 طراحی انتخاب‌شده
</strong>

<div class="color-row">
نام سایت:
<span id="siteName"></span>
</div>

<div class="color-row">
پس‌زمینه:
<span class="color" id="bgColor"></span>
</div>

<div class="color-row">
رنگ بخش‌ها:
<span class="color" id="cardColor"></span>
</div>

<div class="color-row">
رنگ اصلی:
<span class="color" id="primaryColor"></span>
</div>

<div class="color-row">
رنگ متن:
<span class="color" id="textColor"></span>
</div>

<div class="color-row">
اندازه عنوان:
<span id="titleSize"></span>
</div>

<div class="color-row">
اندازه دکمه:
<span id="buttonSize"></span>
</div>

<div class="color-row">
گردی گوشه‌ها:
<span id="radius"></span>
</div>

</div>


<button onclick="submitDesign()">

📤 ارسال طراحی برای بررسی

</button>


<div
class="success"
id="success">
</div>

</div>

</main>


<script>

function getDesign(){

const saved =
localStorage.getItem("ghost_design");

if(!saved){

return null;

}

try{

return JSON.parse(saved);

}

catch(e){

return null;

}

}


function showDesign(){

const design =
getDesign();

if(!design){

document.getElementById("siteName")
.innerText =
"طراحی ذخیره نشده";

return;

}


document.getElementById("siteName")
.innerText =
design.siteName || "-";


document.getElementById("bgColor")
.style.background =
design.bgColor || "#000";


document.getElementById("cardColor")
.style.background =
design.cardColor || "#000";


document.getElementById("primaryColor")
.style.background =
design.primaryColor || "#fff";


document.getElementById("textColor")
.style.background =
design.textColor || "#fff";


document.getElementById("titleSize")
.innerText =
(design.titleSize || "34") + "px";


document.getElementById("buttonSize")
.innerText =
(design.buttonSize || "14") + "px";


document.getElementById("radius")
.innerText =
(design.radius || "15") + "px";

}


function submitDesign(){

const name =
document.getElementById("name")
.value
.trim();

const contact =
document.getElementById("contact")
.value
.trim();

const description =
document.getElementById("description")
.value
.trim();


if(!name || !contact){

alert(
"لطفاً نام و راه ارتباطی را وارد کن."
);

return;

}


const design =
getDesign();


if(!design){

alert(
"ابتدا طراحی سایتت را در صفحه طراحی ذخیره کن."
);

return;

}


const request = {

id:
"GHOST-" + Date.now(),

name:name,

contact:contact,

description:description,

design:design,

status:"در انتظار بررسی",

date:
new Date().toLocaleString("fa-IR")

};


const requests =
JSON.parse(
localStorage.getItem("ghost_requests") || "[]"
);


requests.push(request);


localStorage.setItem(
"ghost_requests",
JSON.stringify(requests)
);


const success =
document.getElementById("success");


success.style.display =
"block";


success.innerHTML =
"✅ طراحی با موفقیت ثبت شد!<br><br>" +

"کد رهگیری شما:<br>" +

"<strong>" +
request.id +
"</strong><br><br>" +

"این کد را نگه دار تا بتوانی وضعیت درخواست را پیگیری کنی.";

}


showDesign();

</script>

</body>

</html>
