<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طراح سایت | Ghost Site Builder</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:tahoma,Arial,sans-serif;
}

.header{
    height:65px;
    background:#111;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    font-weight:bold;
    font-size:19px;
}

.back{
    color:white;
    text-decoration:none;
    background:#222;
    padding:9px 13px;
    border-radius:10px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;

    display:grid;
    grid-template-columns:300px 1fr;
    gap:15px;
}

.controls{
    background:#141414;
    border:1px solid #333;
    border-radius:18px;
    padding:18px;
}

.controls h2{
    margin-top:0;
}

.control{
    margin-top:17px;
}

.control label{
    display:block;
    color:#bbb;
    font-size:12px;
    margin-bottom:7px;
}

input[type="text"]{
    width:100%;
    padding:11px;

    background:#222;
    color:#fff;

    border:1px solid #444;
    border-radius:9px;

    outline:none;
    font-family:tahoma;
}

input[type="color"]{
    width:100%;
    height:42px;
    padding:3px;

    background:#222;
    border:1px solid #444;
    border-radius:9px;
}

input[type="range"]{
    width:100%;
}

.range-value{
    color:#777;
    font-size:11px;
}

.button{
    width:100%;
    padding:13px;

    margin-top:10px;

    border:0;
    border-radius:10px;

    background:#fff;
    color:#000;

    font-family:tahoma;
    font-weight:bold;

    cursor:pointer;
}

.reset{
    background:#252525;
    color:#fff;
    border:1px solid #444;
}

.preview-box{
    background:#171717;
    border:1px solid #333;
    border-radius:18px;
    padding:15px;
}

.preview-label{
    color:#999;
    font-size:12px;
    margin-bottom:10px;
}

.preview{
    min-height:650px;
    overflow:hidden;

    background:#fff;
    color:#111;

    border-radius:15px;
}

.preview-header{
    padding:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#eeeeee;
}

.preview-logo{
    font-weight:bold;
    font-size:18px;
}

.preview-nav{
    display:flex;
    gap:12px;
}

.preview-nav span{
    font-size:11px;
}

.preview-hero{
    padding:70px 20px;
    text-align:center;
}

.preview-hero h1{
    margin:0 0 15px;
    font-size:34px;
}

.preview-hero p{
    color:#666;
    line-height:1.9;
}

.preview-button{
    display:inline-block;

    margin-top:15px;

    padding:13px 22px;

    background:#111;
    color:#fff;

    border-radius:12px;

    text-decoration:none;

    font-size:13px;
    font-weight:bold;
}

.preview-cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;

    padding:20px;
}

.preview-card{
    padding:20px;

    background:#eeeeee;

    border-radius:15px;

    text-align:center;

    min-height:140px;
}

.preview-card-icon{
    font-size:32px;
}

.preview-card h3{
    font-size:14px;
}

.preview-card p{
    font-size:11px;
    color:#666;
}

.preview-footer{
    padding:25px;
    text-align:center;

    background:#eeeeee;

    color:#666;

    font-size:11px;
}

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

    .preview-cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>


<body>


<header class="header">

<div class="logo">
👻 Ghost Site Builder
</div>

<a
class="back"
href="index.html">

← خانه

</a>

</header>


<div class="container">


<!-- پنل کنترل -->

<div class="controls">

<h2>
🎨 طراح سایت
</h2>


<div class="control">

<label>
نام سایت
</label>

<input
id="siteName"
type="text"
value="سایت من">

</div>


<div class="control">

<label>
رنگ پس‌زمینه سایت
</label>

<input
id="backgroundColor"
type="color"
value="#ffffff">

</div>


<div class="control">

<label>
رنگ هدر
</label>

<input
id="headerColor"
type="color"
value="#eeeeee">

</div>


<div class="control">

<label>
رنگ کارت‌ها
</label>

<input
id="cardColor"
type="color"
value="#eeeeee">

</div>


<div class="control">

<label>
رنگ دکمه‌ها
</label>

<input
id="buttonColor"
type="color"
value="#111111">

</div>


<div class="control">

<label>
رنگ نوشته‌ها
</label>

<input
id="textColor"
type="color"
value="#111111">

</div>


<div class="control">

<label>
اندازه عنوان</label>

<input
id="titleSize"
type="range"
min="20"
max="60"
value="34">

<div
class="range-value"
id="titleSizeValue">
34px
</div>

</div>


<div class="control">

<label>
گردی گوشه‌ها
</label>

<input
id="cornerRadius"
type="range"
min="0"
max="40"
value="15">

<div
class="range-value"
id="cornerRadiusValue">
15px
</div>

</div>


<div class="control">

<label>
متن دکمه
</label>

<input
id="buttonText"
type="text"
value="شروع کنید">

</div>


<button
class="button"
id="saveButton">

💾 ذخیره طراحی

</button>


<button
class="button reset"
id="resetButton">

🔄 بازنشانی

</button>

</div>


<!-- پیش‌نمایش -->

<div class="preview-box">

<div class="preview-label">
👀 پیش‌نمایش زنده
</div>


<div
class="preview"
id="preview">


<header
class="preview-header"
id="previewHeader">

<div
class="preview-logo"
id="previewLogo">

سایت من

</div>


<div class="preview-nav">

<span>
خانه
</span>

<span>
درباره
</span>

<span>
تماس
</span>

</div>

</header>


<section
class="preview-hero"
id="previewHero">

<h1
id="previewTitle">

سایت من

</h1>


<p>
این متن نمونه سایت شماست.
</p>


<a
href="#"
class="preview-button"
id="previewButton">

شروع کنید

</a>

</section>


<section
class="preview-cards"
id="previewCards">


<div class="preview-card">

<div class="preview-card-icon">
🚀
</div>

<h3>
سریع
</h3>

<p>
سایت سریع و کاربردی
</p>

</div>


<div class="preview-card">

<div class="preview-card-icon">
🎨
</div>

<h3>
زیبا
</h3>

<p>
طراحی مطابق سلیقه شما
</p>

</div>


<div class="preview-card">

<div class="preview-card-icon">
📱
</div>

<h3>
موبایلی
</h3>

<p>
مناسب گوشی و تبلت
</p>

</div>


</section>


<footer
class="preview-footer"
id="previewFooter">

ساخته شده با Ghost Site Builder 👻

</footer>


</div>

</div>

</div>


<script>

/* گرفتن عناصر */

const siteName =
document.getElementById("siteName");

const backgroundColor =
document.getElementById("backgroundColor");

const headerColor =
document.getElementById("headerColor");

const cardColor =
document.getElementById("cardColor");

const buttonColor =
document.getElementById("buttonColor");

const textColor =
document.getElementById("textColor");

const titleSize =
document.getElementById("titleSize");

const cornerRadius =
document.getElementById("cornerRadius");

const buttonText =
document.getElementById("buttonText");


const preview =
document.getElementById("preview");

const previewHeader =
document.getElementById("previewHeader");

const previewHero =
document.getElementById("previewHero");

const previewLogo =
document.getElementById("previewLogo");

const previewTitle =
document.getElementById("previewTitle");

const previewButton =
document.getElementById("previewButton");

const previewCards =
document.getElementById("previewCards");

const previewFooter =
document.getElementById("previewFooter");

const cards =
document.querySelectorAll(".preview-card");


/* تشخیص رنگ مناسب متن */

function contrast(hex){

    hex =
    hex.replace("#","");

    const r =
    parseInt(hex.substring(0,2),16);

    const g =
    parseInt(hex.substring(2,4),16);

    const b =
    parseInt(hex.substring(4,6),16);

    const brightness =
    (r*299 + g*587 + b*114)/1000;

    if(brightness > 150){
        return "#000000";
    }

    return "#ffffff";
}


/* اعمال تغییرات */

function update(){

    const name =
    siteName.value || "سایت من";

    const bg =
    backgroundColor.value;

    const header =
    headerColor.value;

    const card =
    cardColor.value;

    const button =
    buttonColor.value;

    const text =
    textColor.value;

    const size =
    titleSize.value;

    const radius =
    cornerRadius.value;

    const btnText =
    buttonText.value || "شروع کنید";


    /* نام */

    previewLogo.innerText =
    name;

    previewTitle.innerText =
    name;

    previewButton.innerText =
    btnText;


    /* رنگ پس‌زمینه */

    preview.style.background =
    bg;

    previewHero.style.background =
    bg;


    /* رنگ متن */

    preview.style.color =
    text;

    previewHero.style.color =
    text;

    previewTitle.style.color =
    text;


    /* هدر */

    previewHeader.style.background =
    header;

    previewHeader.style.color =
    contrast(header);


    /* کارت‌ها */

    cards.forEach(function(item){

        item.style.background =
        card;

        item.style.color =
        contrast(card);

    });


    /* دکمه */

    previewButton.style.background =
    button;

    previewButton.style.color =
    contrast(button);

    previewButton.style.borderRadius =
    radius + "px";


    /* اندازه عنوان */

    previewTitle.style.fontSize =
    size + "px";


    /* گردی */

    preview.style.borderRadius =
    radius + "px";


    /* فوتر */

    previewFooter.style.background =
    header;

    previewFooter.style.color =
    contrast(header);


    /* نمایش مقدار */

    document.getElementById(
        "titleSizeValue"
    ).innerText =
    size + "px";


    document.getElementById(
        "cornerRadiusValue"
    ).innerText =
    radius + "px";

}


/* اتصال همه کنترل‌ها */

const controls = [
    siteName,
    backgroundColor,
    headerColor,
    cardColor,
    buttonColor,
    textColor,
    titleSize,
    cornerRadius,
    buttonText
];


controls.forEach(function(control){

    control.addEventListener(
        "input",
        update
    );

    control.addEventListener(
        "change",
        update
    );

});


/* ذخیره */

document
.getElementById("saveButton")
.addEventListener("click",function(){

    const design = {

        siteName:siteName.value,

        backgroundColor:
        backgroundColor.value,

        headerColor:
        headerColor.value,

        cardColor:
        cardColor.value,

        buttonColor:
        buttonColor.value,

        textColor:
        textColor.value,

        titleSize:
        titleSize.value,

        cornerRadius:
        cornerRadius.value,

        buttonText:
        buttonText.value

    };


    localStorage.setItem(
        "ghost_design",
        JSON.stringify(design)
    );


    alert(
        "✅ طراحی با موفقیت ذخیره شد."
    );

});


/* بازنشانی */

document
.getElementById("resetButton")
.addEventListener("click",function(){

    localStorage.removeItem(
        "ghost_design"
    );

    location.reload();

});


/* بارگذاری طراحی قبلی */

function load(){

    const saved =
    localStorage.getItem(
        "ghost_design"
    );

    if(!saved){

        update();
        return;

    }


    try{

        const design =
        JSON.parse(saved);


        if(design.siteName)
            siteName.value =
            design.siteName;

        if(design.backgroundColor)
            backgroundColor.value =
            design.backgroundColor;

        if(design.headerColor)
            headerColor.value =
            design.headerColor;

        if(design.cardColor)
            cardColor.value =
            design.cardColor;

        if(design.buttonColor)
            buttonColor.value =
            design.buttonColor;

        if(design.textColor)
            textColor.value =
            design.textColor;

        if(design.titleSize)
            titleSize.value =
            design.titleSize;

        if(design.cornerRadius)
            cornerRadius.value =
            design.cornerRadius;

        if(design.buttonText)
            buttonText.value =
            design.buttonText;


        update();

    }

    catch(error){

        update();

    }

}


load();

</script>

</body>
</html>
