<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طراحی سایت | Ghost Site Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070707;
    color:white;
    font-family:tahoma,Arial,sans-serif;
}

.header{
    height:70px;
    background:#101010;
    border-bottom:1px solid #292929;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
}

.logo{
    font-weight:bold;
    font-size:20px;
}

.back{
    color:white;
    text-decoration:none;
    background:#222;
    border:1px solid #444;
    padding:9px 13px;
    border-radius:10px;
}

.layout{
    max-width:1100px;
    margin:auto;

    display:grid;
    grid-template-columns:300px 1fr;

    gap:15px;

    padding:15px;
}

.panel{
    background:#121212;
    border:1px solid #303030;
    border-radius:18px;
    padding:18px;

    height:max-content;
}

.panel h2{
    margin-top:0;
    font-size:18px;
}

.group{
    margin-top:18px;
}

.group-title{
    color:#aaa;
    font-size:12px;
    margin-bottom:8px;
}

input[type="text"],
input[type="number"],
select{
    width:100%;

    background:#222;
    color:white;

    border:1px solid #444;
    border-radius:10px;

    padding:11px;

    font-family:tahoma;
}

input[type="color"]{
    width:100%;
    height:45px;

    background:#222;
    border:1px solid #444;

    border-radius:10px;
    padding:3px;
}

input[type="range"]{
    width:100%;
}

.value{
    color:#888;
    font-size:11px;
    margin-top:4px;
}

.preview-area{
    background:#101010;
    border:1px solid #303030;
    border-radius:18px;

    padding:15px;

    min-height:650px;
}

.preview-title{
    color:#888;
    font-size:12px;
    margin-bottom:10px;
}

.website{
    width:100%;
    min-height:580px;

    border-radius:15px;

    overflow:hidden;

    transition:.2s;
}

.site-header{
    padding:25px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.site-logo{
    font-weight:bold;
}

.site-nav{
    display:flex;
    gap:8px;
}

.site-nav span{
    font-size:11px;
}

.hero{
    padding:70px 20px;
    text-align:center;
}

.hero h1{
    margin:0 0 15px;
}

.hero p{
    opacity:.7;
    line-height:1.9;
}

.main-button{
    display:inline-block;

    margin-top:15px;

    padding:13px 22px;

    border-radius:11px;

    text-decoration:none;

    font-size:13px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;

    padding:20px;
}

.card{
    padding:20px;

    border-radius:14px;

    text-align:center;

    min-height:130px;
}

.card-icon{
    font-size:30px;
}

.card h3{
    font-size:14px;
}

.card p{
    font-size:11px;
    opacity:.6;
}

.site-footer{
    padding:25px;
    text-align:center;
    font-size:11px;
    opacity:.6;
}

.action{
    width:100%;

    margin-top:10px;

    padding:13px;

    border:0;
