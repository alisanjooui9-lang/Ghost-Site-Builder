<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>طراحی سایت | Ghost Site Builder</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:white;
    font-family:tahoma,Arial,sans-serif;
    transition:.3s;
}

body.vip{
    background:
    radial-gradient(
        circle at top,
        #3b2c00,
        #080808 65%
    );
}

header{
    height:70px;
    background:#111;
    border-bottom:1px solid #333;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
}

body.vip header{
    border-bottom-color:#ffd700;
}

.logo{
    font-weight:bold;
    font-size:18px;
}

.vip-badge{
    display:none;

    background:#ffd700;
    color:#111;

    padding:5px 8px;
    margin-right:8px;

    border-radius:7px;

    font-size:10px;
    font-weight:bold;
}

body.vip .vip-badge{
    display:inline-block;
}

.back{
    color:white;
    text-decoration:none;

    background:#222;

    border:1px solid #444;

    padding:9px 13px;

    border-radius:10px;
}

.container{
    max-width:1100px;

    margin:auto;

    padding:15px;

    display:grid;

    grid-template-columns:300px 1fr;

    gap:15px;
}

.controls{
    background:#141414;

    border:1px solid #333;

    border-radius:18px;

    padding:18px;
}

body.vip .controls{
    border-color:#b88a00;
}

.control{
    margin-top:16px;
}

label{
    display:block;

    color:#aaa;

    font-size:12px;

    margin-bottom:7px;
}

input[type="text"]{
    width:100%;

    padding:11px;

    background:#222;

    color:white;

    border:1px solid #444;

    border-radius:9px;

    font-family:tahoma;
}

input[type="color"]{
    width:100%;
    height:42px;

    background:#222;

    border:1px solid #444;

    border-radius:9px;
}

input[type="range"]{
    width:100%;
}

.button{
    width:100%;

    margin-top:12px;

    padding:13px;

    border:0;

    border-radius:10px;

    background:white;

    color:#000;

    font-family:tahoma;

    font-weight:bold;

    cursor:pointer;
}

.vip-feature{
    margin-top:15px;

    padding:15px;

    border-radius:13px;

    border:1px solid #806000;

    background:#181818;

    color:#ffd700;

    cursor:pointer;
}

body.vip .vip-feature{
    border-color:#ffd700;

    background:
    linear-gradient(
        135deg,
        #291f05,
        #151515
    );
}

.vip-feature small{
    display:block;

    color:#888;

    margin-top:6px;

    font-size:10px;
}

.preview-box{
    background:#151515;

    border:1px solid #333;

    border-radius:18px;

    padding:15px;
}

.preview{
    min-height:600px;

    background:#fff;

    color:#111;

    border-radius:15px;

    overflow:hidden;

    transition:.3s;
}

.preview-header{
    padding:20px;

    background:#eee;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.preview-logo{
    font-weight:bold;
}

.preview-hero{
    text-align:center;

    padding:70px 20px;
}

.preview-title{
    margin:0;

    font-size:34px;
}

.preview-button{
    display:inline-block;

    margin-top:20px;

    padding:13px 22px;

    background:#111;

    color:white;

    border-radius:12px;

    text-decoration:none;
}

.cards{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:12px;

    padding:20px;
}

.card{
    padding:20px;

    background:#eee;

    border-radius:15px;

    text-align:center;
}

.footer{
    padding:20px;

    text-align:center;

    background:#eee;

    color:#666;

    font-size:11px;
}

body.vip .preview{
    box-shadow:
    0 0 30px
    rgba(255,215,0,.25);
}

body.vip .preview-button{
    background:#d4af37;
    color:#111;
}

body.vip .card{
    background:#f5df91;
}

body.vip .preview-header,
body.vip .footer{
    background:#d4af37;
    color:#111;
}

@media(max-width:800px){

    .container{
        grid-template-columns:1fr;
    }

    .cards{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<header>

<div class="logo">

👻 Ghost Site Builder

<span class="vip-badge">
👑 VIP Ghost
</span>

</div>

<a
href="index.html"
class="back">

← خانه

</a>

</header>


<div class="container">


<div class="controls">

<h2>🎨 طراحی سایت</h2>


<div class="control">

<label>
نام سایت
</label>

<input
id="siteName"
type="text"
value="سایت من">

</div>


<div class="control">

<label>
رنگ پس‌زمینه
</label>

<input
id="background"
type="color"
value="#ffffff">

</div>


<div class="control">

<label>
رنگ هدر
</label>

<input
id="headerColor"
type="color"
value="#eeeeee">

</div>


<div class="control">

<label>
رنگ کارت
</label>

<input
id="cardColor"
type="color"
value="#eeeeee">

</div>


<div class="control">

<label>
رنگ دکمه
</label>

<input
id="buttonColor"
type="color"
value="#111111">

</div>


<div class="control">

<label>
اندازه عنوان
</label>

<input
id="titleSize"
type="range"
min="20"
max="60"
value="34">

</div>


<div
class="vip-feature"
onclick="vipFeature()">

👑 امکانات طلایی

<small id="vipText">
🔒 برای استفاده باید VIP Ghost داشته باشید.
</small>

</div>


<div
class="vip-feature"
onclick="removeBrand()">

🧹 حذف نام سازنده

<small>
🔒 مخصوص VIP Ghost
</small>

</div>


<button
class="button"
onclick="saveDesign()">

💾 ذخیره طراحی

</button>


</div>



<div class="preview-box">

<p>
👀 پیش‌نمایش
</p>


<div
class="preview"
id="preview">


<div
class="preview-header"
id="previewHeader">

<div
class="preview-logo"
id="previewLogo">

سایت من

</div>

<div>
خانه
</div>

</div>


<div class="preview-hero">

<h1
class="preview-title"
id="previewTitle">

سایت من

</h1>

<p>
این یک نمونه سایت است.
</p>

<a
href="#"
class="preview-button">

شروع کنید

</a>

</div>


<div class="cards">

<div class="card">
🚀
<br>
سریع
</div>

<div class="card">
🎨
<br>
زیبا
</div>

<div class="card">
📱
<br>
موبایلی
</div>

</div>


<div
class="footer"
id="footer">

ساخته شده توسط Ghost Site Builder

</div>


</div>

</div>

</div>


<script>


/* بررسی VIP */

function isVIP(){

    return localStorage.getItem(
        "ghost_vip"
    ) === "true";

}


/* اعمال VIP */

function applyVIP(){

    if(
        isVIP()
    ){

        document.body.classList.add(
            "vip"
        );

        document.getElementById(
            "vipText"
        ).innerText =
        "✅ امکانات طلایی فعال است.";

    }

}


/* قابلیت VIP */

function vipFeature(){

    if(
        !isVIP()
    ){

        window.location.href =
        "vip.html";

        return;

    }

    alert(
        "👑 امکانات VIP Ghost فعال هستند!"
    );

}


/* حذف برند */

function removeBrand(){

    if(
        !isVIP()
    ){

        window.location.href =
        "vip.html";

        return;

    }

    document.getElementById(
        "footer"
    ).style.display =
    "none";

}


/* پیش‌نمایش */

const siteName =
document.getElementById(
    "siteName"
);

const background =
document.getElementById(
    "background"
);

const headerColor =
document.getElementById(
    "headerColor"
);

const cardColor =
document.getElementById(
    "cardColor"
);

const buttonColor =
document.getElementById(
    "buttonColor"
);

const titleSize =
document.getElementById(
    "titleSize"
);


function update(){

    document.getElementById(
        "preview"
    ).style.background =
    background.value;


    document.getElementById(
        "previewHeader"
    ).style.background =
    headerColor.value;


    document.getElementById(
        "previewLogo"
    ).innerText =
    siteName.value;


    document.getElementById(
        "previewTitle"
    ).innerText =
    siteName.value;


    document.getElementById(
        "previewTitle"
    ).style.fontSize =
    titleSize.value + "px";


    document.querySelectorAll(
        ".card"
    ).forEach(function(card){

        card.style.background =
        cardColor.value;

    });


    document.querySelector(
        ".preview-button"
    ).style.background =
    buttonColor.value;

}


[
    siteName,
    background,
    headerColor,
    cardColor,
    buttonColor,
    titleSize
].forEach(function(el){

    el.addEventListener(
        "input",
        update
    );

});


/* ذخیره */

function saveDesign(){

    localStorage.setItem(
        "ghost_design",
        JSON.stringify({

            name:
            siteName.value,

            background:
            background.value,

            header:
            headerColor.value,

            card:
            cardColor.value,

            button:
            buttonColor.value,

            title:
            titleSize.value

        })
    );


    alert(
        "✅ طراحی ذخیره شد."
    );

}


/* شروع */

applyVIP();

update();

</script>

</body>
</html>
