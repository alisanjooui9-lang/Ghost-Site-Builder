<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>VIP Ghost</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:tahoma,Arial,sans-serif;
}

.header{
    height:70px;
    padding:0 15px;

    background:#111;

    border-bottom:1px solid #6f5610;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.vip-logo{
    color:#ffd700;
}

.back{
    color:white;
    text-decoration:none;

    background:#222;

    border:1px solid #444;

    padding:9px 13px;

    border-radius:10px;
}

.container{
    max-width:950px;

    margin:auto;

    padding:30px 15px 60px;
}

.hero{
    text-align:center;

    padding:35px 15px;
}

.crown{
    font-size:70px;

    filter:
    drop-shadow(0 0 15px #ffd700);
}

h1{
    margin:15px 0 8px;

    font-size:35px;

    background:
    linear-gradient(
        90deg,
        #9c6f00,
        #ffd700,
        #fff2a8,
        #ffd700,
        #9c6f00
    );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.subtitle{
    color:#aaa;

    line-height:2;

    font-size:13px;
}

.vip-card{
    position:relative;

    margin:25px auto;

    max-width:650px;

    padding:28px;

    border-radius:22px;

    background:
    linear-gradient(
        145deg,
        #161616,
        #241d0a,
        #121212
    );

    border:1px solid #b88a00;

    box-shadow:
    0 0 35px rgba(255,215,0,.12);
}

.vip-card::before{
    content:"";

    position:absolute;

    inset:0;

    border-radius:22px;

    pointer-events:none;

    background:
    linear-gradient(
        120deg,
        transparent,
        rgba(255,215,0,.08),
        transparent
    );
}

.price{
    text-align:center;

    color:#ffd700;

    font-size:28px;

    font-weight:bold;

    margin:10px 0 20px;
}

.activate{
    width:100%;

    padding:15px;

    border:0;

    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        #8c6200,
        #ffd700,
        #b78300
    );

    color:#111;

    font-family:tahoma;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;
}

.status{
    display:none;

    text-align:center;

    margin-top:15px;

    padding:12px;

    border-radius:11px;

    background:#2a2107;

    border:1px solid #8d6b00;

    color:#ffd700;
}

.section-title{
    text-align:center;

    margin:45px 0 20px;
}

.features{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:13px;
}

.feature{
    position:relative;

    background:#141414;

    border:1px solid #333;

    border-radius:17px;

    padding:20px;

    min-height:150px;

    transition:.2s;
}

.feature:hover{
    transform:translateY(-3px);

    border-color:#b88a00;
}

.feature.vip{
    border-color:#8f6b00;

    background:
    linear-gradient(
        145deg,
        #151515,
        #1d1808
    );
}

.icon{
    font-size:32px;

    margin-bottom:10px;
}

.feature h3{
    font-size:14px;

    margin:5px 0 9px;
}

.feature p{
    color:#888;

    font-size:11px;

    line-height:1.8;
}

.badge{
    position:absolute;

    top:12px;
    left:12px;

    background:#ffd700;

    color:#111;

    font-size:9px;

    padding:5px 7px;

    border-radius:7px;

    font-weight:bold;
}

.lock{
    position:absolute;

    top:12px;
    left:12px;

    font-size:18px;
}

.bottom{
    text-align:center;

    margin-top:45px;
}

.design-button{
    display:inline-block;

    padding:13px 20px;

    border-radius:12px;

    background:#222;

    border:1px solid #444;

    color:white;

    text-decoration:none;
}

@media(max-width:700px){

    .features{
        grid-template-columns:1fr;
    }

    h1{
        font-size:29px;
    }
}

</style>

</head>


<body>


<header class="header">

<div class="logo">
👻 <span class="vip-logo">VIP Ghost</span>
</div>

<a
class="back"
href="index.html">

← خانه

</a>

</header>


<main class="container">


<section class="hero">

<div class="crown">
👑
</div>

<h1>
VIP Ghost
</h1>

<p class="subtitle">
نسخه ویژه و حرفه‌ای Ghost Site Builder
<br>
امکانات بیشتر، طراحی حرفه‌ای‌تر و بدون نام سازنده
</p>


<div class="vip-card">

<div class="price">
✨ VIP Ghost
</div>

<p class="subtitle">
تمام امکانات ویژه طراحی سایت را فعال کن.
</p>

<button
class="activate"
onclick="activateVIP()">

👑 فعال‌سازی VIP Ghost

</button>


<div
class="status"
id="status">
